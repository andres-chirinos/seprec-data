name: ETL Kaggle Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 1,4,7,10 *"

jobs:
  ejecutar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Extracción buscador (live)
        run: |
          python scripts/pipeline_seprec.py buscador --live \
            --palabras a e i o u \
            --save-raw data/raw/buscador \
            --output-dir output/parquet

      - name: Extracción detalles (desde JSONs)
        run: |
          python scripts/pipeline_seprec.py detalles --from-json \
            --input-dir data/raw/buscador \
            --output-dir output/parquet

      - name: Subida a Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python scripts/upload_kaggle.py \
            --input-dir output/parquet \
            --kaggle-id andreschirinos/seprec \
            --version-message "Automatic Upload $(date -u +%Y-%m-%d)"